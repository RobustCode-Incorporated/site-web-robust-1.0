name: Content validation

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/build-content.mjs"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Build content and validate (frontmatter, unique slugs, internal links)
        run: npm run build:content:check
